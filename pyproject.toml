[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis-engine"
version = "0.1.0"
description = "Notebook-first stock screening and backtesting research engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openai>=1,<3",
  "pandas>=2.1,<4",
  "requests>=2.31,<3",
  "yfinance>=0.2.40,<2",
]

[project.optional-dependencies]
notebook = ["jupyter>=1,<2"]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = [
  "analysis_functions",
  "analysis_interfaces",
  "analysis_types",
  "backtesting",
  "config",
  "dao",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
